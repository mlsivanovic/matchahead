<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F7F9FC" />
    <script>
      (function () {
        var preference = 'auto';
        try {
          var raw = localStorage.getItem('matchahead.device.prefs');
          if (raw) {
            var parsed = JSON.parse(raw);
            var theme = parsed && parsed.theme;
            if (theme === 'light' || theme === 'dark' || theme === 'auto') preference = theme;
          }
        } catch (error) {}
        var systemDark = false;
        try {
          systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches === true;
        } catch (error) {}
        var resolved = preference === 'dark' || (preference === 'auto' && systemDark) ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', resolved);
        root.style.colorScheme = resolved;
        root.style.backgroundColor = resolved === 'dark' ? '#111318' : '#F7F9FC';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#111318' : '#F7F9FC');
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MatchAhead" />
    <title>MatchAhead</title>
    <script>
      (function () {
        var base = "%BASE_URL%";
        var path = location.pathname;
        if (path.indexOf(base) !== 0) return;
        var rest = path.slice(base.length).replace(/^index\.html$/, "").replace(/\/$/, "");
        if (!rest) return;
        location.replace(base + "#/" + rest + location.search);
      })();
    </script>
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
