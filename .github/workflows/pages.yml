name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            experiments/schedule-service/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Install schedule service checks
        working-directory: experiments/schedule-service
        run: npm ci
      - name: Check domain contracts
        run: node scripts/check-data-contracts.mjs
      - name: Check schedule service
        run: node scripts/check-schedule-service.mjs
      - name: Check web behavior
        working-directory: apps/web
        run: npm run check
      - name: Build
        working-directory: apps/web
        env:
          MATCHAHEAD_BASE: /matchahead/
          MATCHAHEAD_BUILD: ${{ github.sha }}
          # Javna Firebase web konfiguracija iz repository VARIABLES (nisu tajne).
          # Prazne vrednosti ostavljaju klijent nepodešen; pristup zahteva Google prijavu.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          # Javna HTTPS adresa phase-05 servera; sportski ključevi ne idu u build.
          VITE_SCHEDULE_API_URL: ${{ vars.VITE_SCHEDULE_API_URL }}
        run: |
          node -e "const u = new URL(process.env.VITE_SCHEDULE_API_URL); if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash) throw new Error('Public schedule API URL is missing or invalid')"
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
